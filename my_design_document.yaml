      - url: "{{ _.base_url }}/accounts/{{ _.accountId }}/debit"
        name: Debit an account
        meta:
          id: req_b752647b7b7d4126b66e2fe2e136ad31
          created: 1753185245826
          modified: 1753185245826
          isPrivate: false
          description: Decreases the account's balance by the specified amount.
          sortKey: -1753185245826
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "amount": 100
            }
        headers:
          - name: Content-Type
            disabled: false
            value: application/json
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
      - url: "{{ _.base_url }}/accounts/{{ _.accountId }}/credit"
        name: Credit an account
        meta:
          id: req_87e61e558bc24aa39a64ed44f068d559
          created: 1753185245827
          modified: 1753187258460
          isPrivate: false
          description: Increases the account's balance by the specified amount.
          sortKey: -1753185245827
        method: POST
        body:
          mimeType: application/json
          text: |-
            {
              "amount": 100
            }
        headers:
          - name: Content-Type
            disabled: false
            value: application/json
        scripts:
          preRequest: >-
            if (!insomnia.environment.get("accountId")) {

              const host = insomnia.environment.get("host");

              const scheme = insomnia.environment.get("scheme");

              const baseUrl = `${scheme}://${host}`;
             
              const createAccountRequest = {

                url: `${baseUrl}/accounts`,

                method: 'POST',

                headers: {

                  'Content-Type': 'application/json',

                },

                body: {

                  mode: 'raw',

                  raw: JSON.stringify({

                    type: 'savings',

                    initial_balance: 5000.00,

                  }),

                },

              };
             
              const response = await new Promise((resolve, reject) => {

                insomnia.sendRequest(createAccountRequest, (err, resp) => {

                  if (err != null) reject(err);

                  else resolve(resp); 

                });

              });
             
              if (response.code !== 201) {

                throw new Error(`Account creation failed. Status code: ${response.code}`);

              }
             
              const responseBody = JSON.parse(response.body.toString());

              insomnia.environment.set('accountId', responseBody.account_id);

            }
        settings:
          renderRequestBody: true
          encodeUrl: true
          followRedirects: global
          cookies:
            send: true
            store: true
          rebuildPath: true
